policy_version = "1.0"
policy_id = "agent-first-default"
mode = "shadow"

[repository]
product_docs = "docs/product"
stories = "docs/stories"
decisions = "docs/decisions"
tasks = "docs/tasks"

[lanes.tiny]
trace_tier = "minimal"
story = "when_behavior_bearing"
proof = ["quick"]
capsule = "when_material"

[lanes.normal]
trace_tier = "standard"
story = "when_behavior_bearing"
proof = ["declared-story-plan"]
capsule = "required"

[lanes.high_risk]
trace_tier = "detailed"
story = "required"
proof = ["declared-validation-plan"]
capsule = "required"

[classification]
normal_min_flags = 2
high_risk_min_flags = 4
hard_gates = [
  "auth",
  "authorization",
  "data-migration",
  "audit-security",
  "external-provider",
  "weaken-validation",
]

[classification.aliases]
external_systems = "external_provider"
external_provider_behavior = "external_provider"
data_loss = "data_migration"
data_loss_or_migration = "data_migration"
removing_or_weakening_validation_requirements = "weaken_validation"

[approvals]
required_for = [
  "architecture-direction",
  "source-hierarchy",
  "risk-policy",
  "weaken-validation",
  "destructive-data-action",
  "handoff",
]

[friction]
allowed_dispositions = ["fixed-now", "backlog", "accepted-risk", "not-friction"]

[context]
stop_condition = "Stop retrieval after all must_read paths are loaded and relevant should_read entries are dispositioned."

[context.token_budget]
tiny = 2000
normal = 5000
high_risk = 10000

[[context.rules]]
id = "intake-base"
phases = ["intake"]
always = true
must_read = ["AGENTS.md", "_harness/bin/harness-cli query matrix"]

[[context.rules]]
id = "intake-tiny-skip"
phases = ["intake"]
lanes = ["tiny"]
always = true
skip = ["_harness/ARCHITECTURE.md"]

[[context.rules]]
id = "intake-expanded"
phases = ["intake"]
lanes = ["normal", "high_risk"]
always = true
must_read = ["README.md"]

[[context.rules]]
id = "planning-base"
phases = ["planning"]
always = true
must_read = ["<changed-files>"]

[[context.rules]]
id = "planning-story"
phases = ["planning"]
lanes = ["normal", "high_risk"]
always = true
must_read = ["_harness/templates/story.md"]

[[context.rules]]
id = "planning-high-risk"
phases = ["planning"]
lanes = ["high_risk"]
always = true
must_read = ["_harness/templates/story.md"]

[[context.rules]]
id = "work-base"
phases = ["work"]
always = true
must_read = ["<changed-files>"]

[[context.rules]]
id = "work-story"
phases = ["work"]
lanes = ["normal", "high_risk"]
always = true
must_read = ["docs/stories/"]
should_read = ["_harness/ARCHITECTURE.md"]

[[context.rules]]
id = "work-high-risk"
phases = ["work"]
lanes = ["high_risk"]
always = true
must_read = ["_harness/ARCHITECTURE.md", "_harness/templates/story.md"]

[[context.rules]]
id = "finish-base"
phases = ["finish"]
always = true
must_read = ["git status --short"]

[[context.rules]]
id = "finish-tiny"
phases = ["finish"]
lanes = ["tiny"]
always = true
should_read = ["_harness/bin/harness-cli query matrix"]

[[context.rules]]
id = "finish-expanded"
phases = ["finish"]
lanes = ["normal", "high_risk"]
always = true
must_read = ["_harness/bin/harness-cli query matrix"]

[[context.rules]]
id = "schema-change"
when_paths = ["_harness/scripts/schema/**"]
must_read = ["docs/decisions/0004-sqlite-durable-layer.md"]

[[context.rules]]
id = "cli-distribution"
when_paths = ["crates/harness-cli/**", "_harness/bin/**", "install.sh"]
must_read = ["docs/decisions/0005-prebuilt-rust-harness-cli.md", "_harness/scripts/schema/"]
should_read = ["_harness/bin/harness-cli --help"]

[[context.rules]]
id = "provider-security"
lanes = ["high_risk"]
when_flags = ["auth", "authorization", "audit-security", "external-provider", "data-migration", "weaken-validation"]
must_read = ["_harness/templates/story.md", "docs/decisions/"]

[[context.rules]]
id = "public-contract"
when_flags = ["public-contract", "public-contracts"]
must_read = ["docs/product/", "docs/stories/"]
